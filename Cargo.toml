[package]
name = "inkwell"
version = "0.1.2"
edition = "2024"
description = "Inkwell - e-reader highlights to Obsidian Markdown"
authors = ["Paul Healey"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
anyhow = "1.0"
chrono = "0.4"
